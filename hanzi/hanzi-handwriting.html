<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>汉字 | Handwriting Recognition - Edukultur AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI-powered Chinese character (Hanzi) handwriting recognition for interactive learning" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Dark Theme Colors (Default) */
      --color-bg-primary: #0a0a0f;
      --color-bg-secondary: #13131a;
      --color-bg-surface: rgba(255, 255, 255, 0.05);
      --color-text-primary: #ffffff;
      --color-text-secondary: #a0a0b0;
      --color-text-muted: #6b7280;
      --color-accent-primary: #6366f1;
      --color-accent-secondary: #06b6d4;
      --color-success: #10b981;
      
      /* Gradients */
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-cta: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
      --gradient-text: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
      
      /* Typography */
      --font-heading: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      
      /* Shadows */
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.2);
      --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.3);
    }

    /* Light Theme */
    [data-theme="light"] {
      --color-bg-primary: #ffffff;
      --color-bg-secondary: #f8f9fa;
      --color-bg-surface: rgba(0, 0, 0, 0.03);
      --color-text-primary: #1a1a1f;
      --color-text-secondary: #4a5568;
      --color-text-muted: #9ca3af;
      
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
      --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.2);
    }
    
    body {
      font-family: var(--font-body);
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* === Header === */
    .demo-header {
      background: var(--color-bg-secondary);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem 0;
      margin-bottom: 2rem;
    }

    .demo-header-content {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .theme-toggle {
      background: var(--color-bg-surface);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
      padding: 0.4rem;
      cursor: pointer;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .theme-toggle:hover { color: var(--color-text-primary); }
    [data-theme="light"] .sun-icon { display: none; }
    [data-theme="dark"] .moon-icon,
    body:not([data-theme]) .moon-icon { display: none; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--color-bg-surface);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
      color: var(--color-text-secondary);
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--color-text-primary);
      transform: translateX(-2px);
    }

    .demo-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .main-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: calc(100vh - 120px);
    }
    
    .container {
      max-width: 500px;
      width: 100%;
    }
    
    h1 {
      text-align: center;
      color: #1d1d1f;
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 2px;
    }
    
    .subtitle {
      text-align: center;
      color: #6e6e73;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 300;
    }
    
    .text-display-wrapper {
      background: var(--color-bg-secondary);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
    }
    
    .text-display-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    
    .text-display-title {
      color: #6e6e73;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    
    .btn-clear-text {
      padding: 8px 16px;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
      color: #1d1d1f;
    }
    
    .btn-clear-text:hover {
      background: #f5f5f7;
      border-color: #1d1d1f;
    }
    
    .text-display {
      min-height: 60px;
      padding: 15px;
      background: var(--color-bg-primary);
      border-radius: 12px;
      font-size: 32px;
      line-height: 1.5;
      word-wrap: break-word;
      color: var(--color-text-primary);
    }
    
    .text-display.empty {
      color: #86868b;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .drawing-wrapper {
      background: var(--color-bg-secondary);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
    }
    
    .drawingBoard {
      width: 100%;
      height: 320px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      cursor: crosshair;
      background: var(--color-bg-primary);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s ease;
    }
    
    .drawingBoard:hover {
      border-color: #86868b;
    }
    
    .drawingBoard.loading {
      background: #f5f5f7;
    }
    
    .drawingBoard span {
      display: none;
      color: #86868b;
      font-size: 14px;
      font-weight: 300;
    }
    
    .drawingBoard.loading span {
      display: block;
    }
    
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }
    
    .btn {
      flex: 1;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--color-bg-surface);
      color: var(--color-text-primary);
      letter-spacing: 0.5px;
    }
    
    .btn:hover {
      background: #f5f5f7;
      border-color: #1d1d1f;
    }
    
    .btn-submit {
      background: var(--gradient-cta);
      color: white;
      border: none;
      font-weight: 600;
    }
    
    .btn-submit:hover {
      background: var(--gradient-cta);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }
    
    .results-wrapper {
      background: var(--color-bg-secondary);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--shadow-md);
    }
    
    .results-title {
      color: #6e6e73;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .predictions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 120px;
    }
    
    .predictions .prediction {
      max-width: 200px;
      min-width: 150px;
    }
    
    .prediction {
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 15px;
      border-radius: 12px;
      background: #f5f5f7;
      border: 2px solid #d2d2d7;
      flex: 1;
      max-width: 140px;
    }
    
    .prediction:hover {
      transform: translateY(-5px);
      background: #1d1d1f;
      border-color: #1d1d1f;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }
    
    .prediction:hover .char {
      color: white;
    }
    
    .prediction:hover .rank {
      color: #d2d2d7;
    }
    
    .prediction .rank {
      font-size: 11px;
      color: #86868b;
      margin-bottom: 8px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    
    .prediction .char {
      font-size: 56px;
      color: #1d1d1f;
      transition: color 0.3s ease;
      font-weight: 300;
    }
    
    .prediction.first .rank {
      color: #1d1d1f;
      font-weight: 500;
    }
    
    .prediction.first {
      background: white;
      border-color: #1d1d1f;
    }
    
    .empty-state {
      text-align: center;
      color: #86868b;
      font-style: italic;
      font-size: 14px;
      font-weight: 300;
    }
    
    .notification {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1d1d1f;
      color: white;
      padding: 16px 32px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 400;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .notification.show {
      opacity: 1;
    }
    
    /* Touch drawing fix — prevent page scroll while drawing */
    .drawingBoard canvas {
      touch-action: none;
    }

    .canvas-hint {
      text-align: center;
      font-size: 11px;
      color: var(--color-text-muted);
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    /* Better notification */
    .notification {
      font-family: var(--font-body);
    }
    .notification.notify-success { background: #10b981; }
    .notification.notify-error   { background: #e74c3c; }

    @media (max-width: 600px) {
      .demo-header { padding: 0.5rem 0; margin-bottom: 0; }
      .demo-title { font-size: 1rem; }
      .main-container { padding: 12px; min-height: auto; }
      .container { padding: 0; }
      h1 { font-size: 20px; margin-bottom: 4px; }
      .subtitle { margin-bottom: 12px; font-size: 12px; }
      .text-display-wrapper { padding: 14px; margin-bottom: 10px; border-radius: 12px; }
      .text-display-header { margin-bottom: 8px; }
      .text-display { min-height: 46px; padding: 10px; font-size: 26px; }
      .drawing-wrapper { padding: 14px; margin-bottom: 10px; border-radius: 12px; }
      .drawingBoard { height: 230px; border-radius: 10px; }
      .controls { margin-top: 10px; gap: 8px; }
      .btn { padding: 11px 8px; font-size: 12px; }
      .results-wrapper { padding: 14px; border-radius: 12px; }
      .results-title { margin-bottom: 12px; }
      .predictions { gap: 10px; min-height: 80px; }
      .prediction { padding: 10px 8px; border-radius: 10px; }
      .prediction .char { font-size: 40px; }
      .prediction .rank { font-size: 10px; margin-bottom: 4px; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="demo-header">
    <div class="demo-header-content">
      <a href="../index.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 12H5M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to Homepage
      </a>
      <h1 class="demo-title">Hanzi Writing Demo</h1>
      <button class="theme-toggle" aria-label="Toggle theme" onclick="(function(){var t=document.body.getAttribute('data-theme')==='dark'?'light':'dark';document.body.setAttribute('data-theme',t);localStorage.setItem('theme',t);})()">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/><path d="M12 1V3M12 21V23M23 12H21M3 12H1M20.49 3.51L19.07 4.93M4.93 19.07L3.51 20.49M20.49 20.49L19.07 19.07M4.93 4.93L3.51 3.51" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="main-container">
    <div class="container">
      <h1>汉字识别</h1>
      <p class="subtitle">Handwriting Recognition</p>
    
    <div class="text-display-wrapper">
      <div class="text-display-header">
        <div class="text-display-title">Your Text</div>
        <button class="btn-clear-text">Clear Text</button>
      </div>
      <div class="text-display empty">Select characters below to start typing</div>
    </div>
    
    <div class="drawing-wrapper">
      <div class="drawingBoard loading">
        <span>Loading...</span>
      </div>
      <div class="controls">
        <button class="btn btn-undo">Undo</button>
        <button class="btn btn-clear">Clear</button>
        <button class="btn btn-submit" id="submitBtn">Submit</button>
      </div>
      <p class="canvas-hint">Draw one stroke at a time · Tap a result to add it</p>
    </div>
    
    <div class="results-wrapper">
      <div class="results-title">Recognition Result</div>
      <div class="predictions">
        <div class="empty-state">Draw a character and click Submit</div>
      </div>
    </div>
    </div>
  </div>
  
  <div class="notification" id="notification"></div>

  <script src="jquery-3.6.0.min.js"></script>
  <script>if (typeof jQuery === 'undefined') { document.write('<script src="https://code.jquery.com/jquery-3.6.0.min.js"><\/script>'); }</script>
  <script src="hanzilookup.min.js"></script>
  <script>
    // Restore saved theme before render
    (function() {
      var t = localStorage.getItem('theme') || 'dark';
      document.body.setAttribute('data-theme', t);
    })();

    var app = (function () {
      var drawingBoard;
      var matcher;
      var isLoaded = false;
      var selectedText = "";

      $(document).ready(function () {
        HanziLookup.init("mmah", "mmah.json", fileLoaded);
      });

      function fileLoaded(success) {
        if (!success) {
          $(".drawingBoard span").text("Failed to load");
          return;
        }
        
        isLoaded = true;
        matcher = new HanziLookup.Matcher("mmah");
        $(".drawingBoard").removeClass("loading");
        drawingBoard = HanziLookup.DrawingBoard($(".drawingBoard").first(), function() {
          // Don't auto-lookup, wait for submit button
        });
        
        $(".btn-clear").click(function () {
          drawingBoard.clearCanvas();
          drawingBoard.redraw();
          clearResults();
        });
        
        $(".btn-undo").click(function () {
          drawingBoard.undoStroke();
          drawingBoard.redraw();
          clearResults(); // Don't auto-lookup on undo
        });
        
        $(".btn-clear-text").click(function () {
          clearTextDisplay();
        });
        
        $("#submitBtn").click(function () {
          lookup();
        });
      }

      function lookup() {
        if (!isLoaded) return;
        var strokes = drawingBoard.cloneStrokes();
        if (!strokes || strokes.length === 0) {
          showNotification('✏️ Draw a character first', 'error');
          return;
        }
        var analyzedChar = new HanziLookup.AnalyzedCharacter(strokes);
        matcher.match(analyzedChar, 3, function(matches) {
          displayResults(matches);
          // Auto-clear canvas after recognition
          drawingBoard.clearCanvas();
          drawingBoard.redraw();
        });
      }

      function displayResults(matches) {
        var predictionsDiv = $(".predictions");
        predictionsDiv.empty();

        if (matches.length === 0) {
          predictionsDiv.append('<div class="empty-state">No match found — try drawing more strokes</div>');
          return;
        }

        var labels = ['BEST MATCH', '2ND', '3RD'];
        matches.forEach(function(match, i) {
          var char = match.character;
          var div = $("<div></div>")
            .addClass("prediction" + (i === 0 ? " first" : ""))
            .html('<div class="rank">' + (labels[i] || (i+1)+'TH') + '</div><div class="char">' + char + '</div>');
          div.click(function() { addCharacterToText(char); });
          predictionsDiv.append(div);
        });
      }

      function clearResults() {
        $(".predictions").html('<div class="empty-state">Draw a character and click Submit</div>');
      }
      
      function showNotification(msg, type) {
        var notification = $("#notification");
        notification.removeClass("notify-success notify-error");
        if (type === 'success') notification.addClass("notify-success");
        else if (type === 'error') notification.addClass("notify-error");
        notification.text(msg).addClass("show");
        setTimeout(function() { notification.removeClass("show notify-success notify-error"); }, 1200);
      }

      function addCharacterToText(char) {
        selectedText += char;
        updateTextDisplay();

        drawingBoard.clearCanvas();
        drawingBoard.redraw();
        clearResults();

        showNotification("✓ Added " + char, 'success');
      }
      
      function updateTextDisplay() {
        var textDisplay = $(".text-display");
        
        if (selectedText.length === 0) {
          textDisplay.addClass("empty").text("Select characters below to start typing");
        } else {
          textDisplay.removeClass("empty").text(selectedText);
        }
      }
      
      function clearTextDisplay() {
        selectedText = "";
        updateTextDisplay();
        showNotification("Text cleared", 'success');
      }
    })();
  </script>
</body>
</html>
